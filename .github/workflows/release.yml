name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
            cli_name: puplify-cli-linux-x86_64
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            cli_name: puplify-cli-macos-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            cli_name: puplify-cli-windows-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libpulse-dev libclang-dev cmake

      - run: bun install --frozen-lockfile

      - name: Build and publish app bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Puplify ${{ github.ref_name }}"
          releaseBody: "See the README for setup. macOS builds are ad-hoc signed (not notarized): after installing, run `xattr -dr com.apple.quarantine /Applications/Puplify.app`."
          releaseDraft: false
          prerelease: false
          tauriScript: bun run tauri
          args: ${{ matrix.args }}

      - name: Build and upload CLI
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release -p puplify-cli --target ${{ matrix.target }}
          out=target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive=${{ matrix.cli_name }}.zip
            7z a "$archive" "./$out/puplify.exe"
          else
            archive=${{ matrix.cli_name }}.tar.gz
            tar -czf "$archive" -C "$out" puplify
          fi
          gh release upload "${GITHUB_REF_NAME}" "$archive" --clobber
