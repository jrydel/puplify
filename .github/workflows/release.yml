name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
            cli_name: puplify-cli-linux-x86_64
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            cli_name: puplify-cli-macos-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            cli_name: puplify-cli-windows-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libpulse-dev libclang-dev cmake

      - run: bun install --frozen-lockfile

      # Fetched by the Tauri beforeBuildCommand; cached to avoid re-downloading 60 MB per job.
      - name: Cache bundled models
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/models
          key: bundled-models-${{ hashFiles('scripts/fetch-models.ts') }}

      # Developer ID signing + notarization turns on once these repository secrets
      # exist; without them the macOS build stays ad-hoc signed.
      - name: Apple signing credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              value=$(printenv "$name")
              echo "::add-mask::$value"
              echo "$name=$value" >> "$GITHUB_ENV"
            done
            echo "Developer ID signing and notarization enabled"
          else
            echo "No Apple credentials; building ad-hoc signed"
          fi

      - name: Build and publish app bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Puplify ${{ github.ref_name }}"
          releaseBody: "Install or update: https://puplify.com/#download. macOS one-liner: `curl -fsSL https://puplify.com/install.sh | sh`."
          # Published by the `publish` job once every platform has uploaded, so
          # "latest release" never points at a half-uploaded release.
          releaseDraft: true
          prerelease: false
          tauriScript: bun run tauri
          args: ${{ matrix.args }}

      - name: Build and upload CLI
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release -p puplify-cli --target ${{ matrix.target }}
          out=target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive=${{ matrix.cli_name }}.zip
            7z a "$archive" "./$out/puplify.exe"
          else
            archive=${{ matrix.cli_name }}.tar.gz
            tar -czf "$archive" -C "$out" puplify
          fi
          gh release upload "${GITHUB_REF_NAME}" "$archive" --clobber

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
